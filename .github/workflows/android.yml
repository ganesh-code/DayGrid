name: Android CI & Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DayGrid-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Build Reports if Failed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: |
          app/build/reports/
        retention-days: 7

    - name: Release APK for Direct Mobile Download
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.2
        name: "DayGrid v1.0.2 APK"
        make_latest: true
        body: |
          ### 📱 DayGrid Mobile Download (v1.0.2)
          Download `DayGrid-debug.apk` directly to your phone.
          - Authentic Nothing OS 2x2 squircle lock screen widget with 3 rows of dots & NDOT dot-matrix font
          - Dynamic Black & White widget themes adapting automatically to device Light/Dark mode
          - High-contrast, razor-sharp, clearly visible dots on home and lock screen widgets
          - Pure Dynamic Live Wallpaper (time & date text removed to prevent overlapping with system lock screen clock)
          - Static wallpaper generator completely removed from app
          - Bottom navigation bar (Grid, Stats, Wallpaper, Settings)
          - One-time onboarding persistence
          - Today's date displayed on Home screen
        files: |
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
